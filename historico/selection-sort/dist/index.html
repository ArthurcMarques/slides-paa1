<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selection Sort — Apresentação</title><meta name="description" content="História, código em C e análise de desempenho do Selection Sort."><link rel="stylesheet" href="style.css"></head>
<body>
<main><div id="slide" aria-label="Apresentação"><img id="image" alt="" draggable="false"><div id="links"></div></div></main>
<nav aria-label="Navegação da apresentação"><button id="prev" aria-label="Slide anterior">←</button><label for="select" class="sr">Escolher slide</label><select id="select"></select><span id="count" aria-live="polite"></span><button id="next" aria-label="Próximo slide">→</button><button id="full" aria-label="Alternar tela cheia" title="Tela cheia (F)">⛶</button></nav>
<details id="transcript"><summary>Texto do slide</summary><pre id="text"></pre></details>
<script src="data.js"></script><script src="app.js"></script></body></html>
